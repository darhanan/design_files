const frame = document.getElementById("frame");
const cache = {};
const decode = p => cache[p] ??= new TextDecoder().decode(Uint8Array.from(atob(DOCS[p]), c => c.charCodeAt(0)));
let current = null;
function show(platform, hash) {
  current = platform;
  const boot = "<script>window.__PREVIEW_HASH=" + JSON.stringify(hash || "") + "<\/script>";
  frame.srcdoc = decode(platform).replace('<meta charset="utf-8">', '<meta charset="utf-8">' + boot);
  try { history.replaceState(null, "", "#platform=" + platform + (hash ? "&" + hash : "")); } catch {}
}
window.addEventListener("message", e => {
  if (e.source !== frame.contentWindow || !e.data) return;
  if (e.data.jePlatform && DOCS[e.data.jePlatform]) return show(e.data.jePlatform, e.data.jeHash);
  if (e.data.jeHash) { try { history.replaceState(null, "", "#platform=" + current + "&" + e.data.jeHash); } catch {} }
});
const start = new URLSearchParams(location.hash.slice(1));
const first = DOCS[start.get("platform")] ? start.get("platform") : Object.keys(DOCS)[0];
start.delete("platform");
show(first, String(start));
